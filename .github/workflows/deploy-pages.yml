name: نشر المفكرة AI على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: تفعيل pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile
      - name: بناء الموقع
        run: pnpm build
      - name: إعداد Pages
        uses: actions/configure-pages@v5
      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
